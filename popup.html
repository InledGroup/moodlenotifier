<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodle Notifier</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <img src="https://hosted.inled.es/1/moodlenotifier.png" alt="Moodle Notifier" class="logo">
    </header>

    <main id="app">
        <!-- Spinner de Carga -->
        <div id="loader" class="loader-container" style="display: none;">
            <div class="spinner"></div>
            <p id="loading-text"></p>
        </div>

        <!-- Vista de Selección de Idioma -->
        <section id="lang-view" class="view" style="display: none;">
            <h2 id="lang-title"></h2>
            <div class="lang-buttons">
                <button id="lang-es-btn" class="btn-primary" style="margin-bottom: 0.5rem;"></button>
                <button id="lang-en-btn" class="btn-primary"></button>
            </div>
        </section>

        <!-- Vista de Login -->
        <section id="login-view" class="view" style="display: none;">
            <form id="login-form">
                <div class="form-group">
                    <label for="moodle-url" id="label-url"></label>
                    <input type="url" id="moodle-url" required>
                </div>
                <div class="form-group">
                    <label for="username" id="label-user"></label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password" id="label-pass"></label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" id="login-btn" class="btn-primary"></button>
                <p id="login-error" class="error-msg" style="display: none;"></p>
            </form>
        </section>

        <!-- Vista de Tareas -->
        <section id="tasks-view" class="view" style="display: none;">
            <div class="tasks-header">
                <h2 id="tasks-title"></h2>
                <button id="logout-btn" class="btn-link"></button>
            </div>
            <ul id="tasks-list"></ul>
            <div id="empty-tasks" style="display: none;">
                <p id="empty-msg"></p>
            </div>
        </section>
    </main>

    <script type="module" src="popup.js"></script>
</body>
</html>
